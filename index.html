<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد جامع زیست سلولی | دکتر مهرعلیخانی</title>
    <!-- فونت زیبای وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- فریم‌ورک Tailwind CSS برای ظاهر فوق‌العاده و ریسپانسیو -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- فراخوانی دیتای پایتون -->
    <script src="bookData.js"></script>

    <style>
        body { font-family: 'Vazirmatn', Tahoma, sans-serif; background-color: #f8fafc; }
        
        /* استایل اسکرول‌بار */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* پنهان کردن قطعی cite های مزاحم از داخل متن */
        span.hidden { display: none !important; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <!-- سایدبار (منوی کناری) -->
    <!-- در موبایل به صورت کشویی (بیرون صفحه) و در دسکتاپ ثابت است -->
    <aside id="sidebar" class="fixed inset-y-0 right-0 z-50 w-72 bg-slate-900 text-slate-300 transition-transform transform translate-x-full md:relative md:translate-x-0 flex flex-col shadow-2xl md:shadow-none">
        
        <!-- هدر سایدبار -->
        <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-950">
            <h2 class="text-xl font-black text-blue-400">پلتفرم تعاملی زیست</h2>
            <!-- دکمه بستن در موبایل -->
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white text-2xl">&times;</button>
        </div>

        <!-- لیست ماژول‌ها -->
        <div class="flex-1 overflow-y-auto p-4 space-y-2" id="module-list">
            <!-- دکمه‌ها اینجا لود می‌شوند -->
        </div>

        <!-- بخش نام توسعه‌دهنده -->
        <div class="p-4 border-t border-slate-800 bg-slate-900">
            <div class="flex items-center gap-3 bg-slate-800 border border-slate-700 p-3 rounded-2xl shadow-inner">
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-fuchsia-600 to-blue-600 flex items-center justify-center text-white font-black text-xl shadow-lg">ش</div>
                <div>
                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">توسعه دهنده پلتفرم</div>
                    <div class="text-sm font-black text-white">مهندس شیوا فتاحی</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- پس‌زمینه تاریک برای سایدبار در موبایل -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden md:hidden"></div>

    <!-- محتوای اصلی -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        
        <!-- نوار بالایی (هدر اصلی) -->
        <header class="bg-white px-6 py-4 border-b border-slate-200 flex items-center justify-between sticky top-0 z-30 shadow-sm">
            <div class="flex items-center gap-4">
                <!-- دکمه همبرگری موبایل -->
                <button onclick="toggleSidebar()" class="md:hidden text-slate-600 hover:text-blue-600 transition-colors">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <button onclick="renderDashboardHome()" class="flex items-center gap-2 bg-blue-50 text-blue-700 px-4 py-2 rounded-xl font-bold hover:bg-blue-100 transition-colors">
                    <span class="text-xl">🏠</span> داشبورد اصلی
                </button>
            </div>
        </header>

        <!-- بخش اسکرول‌شونده محتوا -->
        <div class="flex-1 overflow-y-auto p-4 md:p-10 pb-32" id="main-scroll-area">
            
            <!-- ویوی 1: داشبورد اصلی (نمودار پیشرفت + کارت‌ها) -->
            <div id="dashboard-view" class="max-w-6xl mx-auto block">
                
                <!-- نمودار پیشرفت -->
                <div class="bg-white p-6 md:p-8 rounded-[2rem] shadow-sm border border-slate-200 mb-10 flex flex-col md:flex-row items-center gap-8 relative overflow-hidden">
                    <div class="absolute -left-10 -top-10 w-32 h-32 bg-blue-50 rounded-full blur-3xl"></div>
                    
                    <div class="flex-1 w-full z-10">
                        <div class="flex justify-between items-end mb-4">
                            <div>
                                <h3 class="text-2xl font-black text-slate-800 mb-1">نمودار پیشرفت شما</h3>
                                <p class="text-sm text-slate-500 font-medium">مسیر یادگیری و حل تست‌ها</p>
                            </div>
                            <div class="text-left">
                                <span class="text-3xl font-black text-blue-600" id="progress-percent">0%</span>
                            </div>
                        </div>
                        <!-- نوار پیشرفت -->
                        <div class="w-full h-4 bg-slate-100 rounded-full overflow-hidden shadow-inner">
                            <div id="progress-bar" class="h-full bg-gradient-to-l from-blue-400 to-emerald-400 rounded-full transition-all duration-1000" style="width: 0%"></div>
                        </div>
                        <div class="flex justify-between mt-3 text-sm font-bold text-slate-400">
                            <span>تست‌های پاسخ داده شده: <span id="answered-count" class="text-slate-700">0</span></span>
                            <span>کل تست‌ها: <span id="total-count" class="text-slate-700">0</span></span>
                        </div>
                    </div>

                    <!-- باکس تعداد جواب‌های درست -->
                    <div class="bg-emerald-50 border border-emerald-100 p-6 rounded-3xl text-center min-w-[150px] z-10">
                        <div class="text-4xl font-black text-emerald-500 mb-2" id="correct-count">0</div>
                        <div class="text-sm font-bold text-emerald-800">پاسخ صحیح 🎯</div>
                    </div>
                </div>

                <h2 class="text-2xl font-black text-slate-800 mb-6 flex items-center gap-3">
                    📚 سرفصل‌های آموزشی
                </h2>

                <!-- گرید کارت‌های ماژول‌ها -->
                <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- کارت‌ها اینجا تولید می‌شوند -->
                </div>
            </div>

            <!-- ویوی 2: محتوای درس و آزمون -->
            <div id="module-view" class="max-w-4xl mx-auto hidden">
                <div id="module-content-area" class="bg-white p-6 md:p-12 rounded-[2rem] shadow-sm border border-slate-200">
                    <!-- متن بلاگری درس اینجا لود می‌شود -->
                </div>
                
                <div id="module-quiz-area" class="mt-10">
                    <!-- کوئیزها اینجا لود می‌شوند -->
                </div>
            </div>

        </div>

        <!-- واترمارک اختصاصی استاد -->
        <div class="fixed bottom-6 left-6 z-40 bg-white/90 backdrop-blur-md px-6 py-3 rounded-full shadow-xl border border-slate-200 text-slate-800 font-black flex items-center gap-3 pointer-events-none">
            <span class="text-2xl drop-shadow-md">🧬</span> زیست سلولی <span class="text-blue-600">دکتر علیرضا مهرعلیخانی</span>
        </div>
    </main>

    <!-- اسکریپت اصلی داشبورد -->
    <script>
        let totalQuestions = 0;
        let answeredQuestions = 0;
        let correctAnswersCount = 0;
        
        // متغیری برای ذخیره اینکه کاربر کدام سوالات را جواب داده تا دوبار حساب نشود
        const userAnswers = {};

        window.onload = () => {
            if (typeof bookData === 'undefined' || bookData.length === 0) {
                document.getElementById('dashboard-view').innerHTML = `
                    <div class="text-center mt-20">
                        <h1 class="text-3xl font-black text-red-500 mb-4">خطا در بارگذاری اطلاعات!</h1>
                        <p class="text-slate-600">فایل bookData.js شناسایی نشد. لطفاً اسکریپت پایتون را اجرا کنید.</p>
                    </div>`;
                return;
            }
            initApp();
        };

        function initApp() {
            // محاسبه کل تست‌های موجود در تمام جزوه
            bookData.forEach((mod, mIndex) => {
                const qs = mod.quiz || mod.quizzes;
                if (qs) {
                    totalQuestions += qs.length;
                    userAnswers[mIndex] = {}; // آماده‌سازی آبجکت برای ثبت جواب‌های هر فصل
                }
            });
            document.getElementById('total-count').innerText = totalQuestions;

            buildSidebar();
            renderDashboardHome();
        }

        // باز و بسته کردن سایدبار در موبایل
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // ساخت منوی کناری
        function buildSidebar() {
            const listContainer = document.getElementById('module-list');
            listContainer.innerHTML = ''; 

            bookData.forEach((mod, index) => {
                const btn = document.createElement('button');
                btn.className = 'sidebar-btn w-full text-right p-4 mb-2 rounded-xl transition-all border border-transparent text-slate-400 hover:bg-slate-800 hover:text-white flex items-center justify-between group';
                btn.innerHTML = `
                    <div class="text-right">
                        <span class="block font-bold mb-1 group-hover:text-blue-400 transition-colors">${index + 1}. ${mod.shortTitle || mod.title}</span>
                    </div>
                `;
                btn.onclick = () => openModule(index, btn);
                listContainer.appendChild(btn);
            });
        }

        // نمایش داشبورد اصلی (ویوی کارت‌ها)
        function renderDashboardHome() {
            document.getElementById('dashboard-view').style.display = 'block';
            document.getElementById('module-view').style.display = 'none';
            
            // برداشتن حالت active از دکمه‌های سایدبار
            document.querySelectorAll('.sidebar-btn').forEach(b => {
                b.classList.remove('bg-blue-600/20', 'border-blue-500/30', 'text-blue-400');
                b.classList.add('text-slate-400');
            });

            const grid = document.getElementById('dashboard-grid');
            let html = '';
            
            bookData.forEach((mod, index) => {
                // پاکسازی کد cite از توضیحات کارت در صورت وجود
                const cleanSub = (mod.subtitle || '').replace(/<span class="hidden">\<\/span>/g, '');
                
                html += `
                <div onclick="openModule(${index})" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 hover:shadow-xl hover:border-blue-300 hover:-translate-y-1 transition-all duration-300 cursor-pointer group relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-blue-50 rounded-bl-full -z-10 group-hover:scale-125 transition-transform"></div>
                    <div class="w-14 h-14 bg-gradient-to-tr from-blue-500 to-cyan-400 text-white rounded-2xl flex items-center justify-center font-black text-2xl mb-5 shadow-md group-hover:rotate-12 transition-transform">${index + 1}</div>
                    <h3 class="text-lg font-black text-slate-800 mb-2 leading-tight">${mod.title}</h3>
                    <p class="text-sm text-slate-500 font-medium line-clamp-2">${cleanSub}</p>
                </div>
                `;
            });
            grid.innerHTML = html;
            
            updateProgressUI();
            if(window.innerWidth < 768 && !document.getElementById('sidebar').classList.contains('translate-x-full')) {
                toggleSidebar(); // بستن سایدبار در موبایل
            }
        }

        // باز کردن یک فصل خاص
        function openModule(index, btnNode) {
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('module-view').style.display = 'block';
            
            // آپدیت ظاهر دکمه‌های سایدبار
            document.querySelectorAll('.sidebar-btn').forEach(b => {
                b.classList.remove('bg-blue-600/20', 'border-blue-500/30', 'text-blue-400');
                b.classList.add('text-slate-400');
            });
            // اگر دکمه سایدبار کلیک نشده بود (از روی کارت کلیک شد)، دکمه متناظرش را پیدا کن
            const actualBtn = btnNode || document.getElementById('module-list').children[index];
            if(actualBtn) {
                actualBtn.classList.remove('text-slate-400');
                actualBtn.classList.add('bg-blue-600/20', 'border-blue-500/30', 'text-blue-400');
            }

            const mod = bookData[index];
            
            // پاکسازی دقیق کدهای cite مخفی از محتوای متنی
            let cleanContent = mod.content.replace(/<span class="hidden">\<\/span>/g, '');

            let contentHtml = `
                <h1 class="text-3xl md:text-4xl font-black text-slate-900 mb-3 border-b-4 border-blue-500 pb-4 inline-block">${mod.title}</h1>
                <h3 class="text-xl font-bold text-slate-500 mb-10">${mod.subtitle || ''}</h3>
                <div class="text-lg text-slate-700 leading-loose">${cleanContent}</div>
            `;
            document.getElementById('module-content-area').innerHTML = contentHtml;

            // بخش کوئیز
            const qs = mod.quiz || mod.quizzes;
            let quizHtml = '';
            
            if (qs && qs.length > 0) {
                quizHtml += `
                <div class="bg-slate-50 p-6 md:p-10 rounded-[2rem] border-2 border-dashed border-slate-300">
                    <h2 class="text-2xl font-black text-blue-600 mb-8 flex items-center gap-3"><span class="text-3xl">🎯</span> آزمون سنجش مهارت</h2>
                    <div class="space-y-8">`;
                
                qs.forEach((q, qIndex) => {
                    // بررسی اینکه آیا کاربر قبلا به این سوال جواب داده؟
                    const alreadyAnswered = userAnswers[index][qIndex] !== undefined;
                    const blockClass = alreadyAnswered ? 'data-answered="true"' : '';
                    
                    quizHtml += `
                    <div class="question-block bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-sm" ${blockClass}>
                        <h4 class="text-lg md:text-xl font-black text-slate-800 mb-6 leading-relaxed"><span class="text-blue-500 ml-1">${qIndex + 1}-</span> ${q.question}</h4>
                        <div class="space-y-3">`;
                    
                    q.options.forEach((opt, oIndex) => {
                        const isCorrect = (oIndex === q.answer);
                        
                        // تعیین استایل دکمه در صورتی که قبلاً جواب داده شده باشد
                        let btnClass = "quiz-option w-full text-right p-4 md:p-5 rounded-2xl border-2 border-slate-100 bg-slate-50 font-bold text-slate-600 transition-all";
                        let disabledState = "";
                        
                        if (alreadyAnswered) {
                            disabledState = "disabled";
                            if (isCorrect) {
                                btnClass += " bg-emerald-100 border-emerald-500 text-emerald-800 opacity-100";
                            } else if (userAnswers[index][qIndex] === oIndex) { // گزینه‌ای که کاربر غلط زده
                                btnClass += " bg-rose-100 border-rose-500 text-rose-800 opacity-100";
                            } else {
                                btnClass += " opacity-50 cursor-not-allowed";
                            }
                        } else {
                            btnClass += " hover:bg-blue-50 hover:border-blue-300 cursor-pointer";
                        }

                        quizHtml += `
                            <button ${disabledState} data-opt-index="${oIndex}" onclick="checkAnswer(${index}, ${qIndex}, ${oIndex}, ${q.answer}, this)" class="${btnClass}">
                                <span class="inline-block w-8 h-8 text-center leading-8 bg-white shadow-sm rounded-full ml-3 text-slate-400 font-black">${oIndex + 1}</span> ${opt}
                            </button>`;
                    });

                    // پاکسازی cite از پاسخنامه تشریحی
                    const cleanExp = q.explanation.replace(/<span class="hidden">\<\/span>/g, '');
                    const expDisplay = alreadyAnswered ? 'block' : 'none';

                    quizHtml += `
                        </div>
                        <div id="exp_${index}_${qIndex}" style="display: ${expDisplay};" class="mt-6 p-5 md:p-6 bg-blue-50 border-r-4 border-blue-500 rounded-l-2xl text-blue-900 text-base leading-loose">
                            <strong class="text-blue-700 text-lg flex items-center gap-2 mb-2"><span>💡</span> تحلیل استاد:</strong>
                            ${cleanExp}
                        </div>
                    </div>`;
                });
                quizHtml += `</div></div>`;
            }
            document.getElementById('module-quiz-area').innerHTML = quizHtml;
            
            // رفتن به بالای صفحه
            document.getElementById('main-scroll-area').scrollTo({ top: 0, behavior: 'smooth' });
            
            // بستن سایدبار در موبایل پس از کلیک روی درس
            if(window.innerWidth < 768 && !document.getElementById('sidebar').classList.contains('translate-x-full')) {
                toggleSidebar();
            }
        }

        // بررسی پاسخ کاربر
        function checkAnswer(mIndex, qIndex, selectedOptIndex, correctOptIndex, btnEl) {
            const parent = btnEl.closest('.question-block');
            
            // اگر قبلاً جواب داده شده هیچ کاری نکن
            if(parent.getAttribute('data-answered') === 'true') return;
            parent.setAttribute('data-answered', 'true');
            
            // ثبت در دیتابیس محلی کاربر
            userAnswers[mIndex][qIndex] = selectedOptIndex;

            // غیرفعال کردن تمام دکمه‌های این سوال
            const btns = parent.querySelectorAll('.quiz-option');
            btns.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:bg-blue-50', 'hover:border-blue-300', 'cursor-pointer');
                b.classList.add('opacity-50', 'cursor-not-allowed');
            });

            // حذف شفافیت از گزینه انتخاب شده
            btnEl.classList.remove('opacity-50');
            
            if (selectedOptIndex === correctOptIndex) {
                // کاربر درست جواب داده: سبز شود
                btnEl.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800', 'opacity-100');
                correctAnswersCount++;
            } else {
                // کاربر غلط جواب داده: خودش قرمز شود
                btnEl.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-800', 'opacity-100');
                // و گزینه درست واقعی سبز شود!
                const correctBtn = parent.querySelector(`[data-opt-index="${correctOptIndex}"]`);
                if (correctBtn) {
                    correctBtn.classList.remove('opacity-50');
                    correctBtn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800', 'opacity-100');
                }
            }
            
            answeredQuestions++;
            updateProgressUI();
            
            // نمایش تحلیل استاد
            document.getElementById(`exp_${mIndex}_${qIndex}`).style.display = 'block';
        }

        // آپدیت کردن نمودار و اعداد داشبورد
        function updateProgressUI() {
            document.getElementById('answered-count').innerText = answeredQuestions;
            document.getElementById('correct-count').innerText = correctAnswersCount;
            
            let percent = 0;
            if (totalQuestions > 0) {
                percent = Math.round((answeredQuestions / totalQuestions) * 100);
            }
            
            document.getElementById('progress-percent').innerText = percent + '%';
            document.getElementById('progress-bar').style.width = percent + '%';
        }
    </script>
</body>
    </html>
