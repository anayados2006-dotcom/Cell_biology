<!DOCTYPE html>
<html lang="fa" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد جامع زیست سلولی | دکتر مهرعلیخانی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="bookData.js"></script>

    <!-- پیکربندی Tailwind برای حالت دارک -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>

    <style>
        body { font-family: 'Vazirmatn', Tahoma, sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        /* استایل اسکرول‌بار */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        span.hidden { display: none !important; }

        /* استایل نمودار دایره‌ای پیشرفت */
        .circular-chart { display: block; margin: 0 auto; max-width: 80%; max-height: 250px; }
        .circle-bg { fill: none; stroke: #e2e8f0; stroke-width: 3.8; }
        .dark .circle-bg { stroke: #334155; }
        .circle { fill: none; stroke-width: 2.8; stroke-linecap: round; transition: stroke-dasharray 1s ease-out; }
        .circle.blue { stroke: #3b82f6; }
        .percentage { fill: #1e293b; font-family: sans-serif; font-size: 0.5em; text-anchor: middle; font-weight: bold; }
        .dark .percentage { fill: #f8fafc; }
        
        /* اصلاح به هم ریختگی متون */
        .text-content p { text-align: right; line-height: 1.8; margin-bottom: 1rem; word-spacing: normal; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-200 flex h-screen overflow-hidden relative">

    <!-- دکمه تغییر تم (تاریک/روشن) -->
    <button onclick="toggleTheme()" class="fixed top-4 left-4 z-50 bg-white dark:bg-slate-800 p-3 rounded-full shadow-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-yellow-400 hover:scale-110 transition-transform">
        <svg id="theme-icon-light" class="w-6 h-6 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 4.22a1 1 0 011.415 0l.708.708a1 1 0 01-1.414 1.414l-.708-.708a1 1 0 010-1.414zM17 10a1 1 0 011 1h1a1 1 0 110-2h-1a1 1 0 01-1 1zm-4.22 4.22a1 1 0 010 1.415l-.708.708a1 1 0 01-1.414-1.414l.708-.708a1 1 0 011.415 0zM10 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm-4.22-4.22a1 1 0 010-1.415l-.708-.708a1 1 0 011.414-1.414l.708.708a1 1 0 01-1.415 0zM3 10a1 1 0 01-1-1H1a1 1 0 110 2h1a1 1 0 011-1zm4.22-4.22a1 1 0 01-1.415 0l-.708-.708a1 1 0 011.414-1.414l.708.708a1 1 0 010 1.414zM10 5a5 5 0 100 10 5 5 0 000-10z"></path></svg>
        <svg id="theme-icon-dark" class="w-6 h-6 block dark:hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
    </button>

    <!-- سایدبار -->
    <aside id="sidebar" class="fixed inset-y-0 right-0 z-40 w-72 bg-slate-900 text-slate-300 transition-transform transform translate-x-full md:relative md:translate-x-0 flex flex-col shadow-2xl md:shadow-none border-l border-slate-800">
        
        <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-950">
            <h2 class="text-xl font-black text-blue-400">پلتفرم تعاملی زیست</h2>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white text-2xl">&times;</button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-2" id="module-list"></div>

        <!-- بخش توسعه‌دهنده با عکس -->
        <div class="p-4 border-t border-slate-800 bg-slate-900">
            <div class="flex items-center gap-3 bg-slate-800 border border-slate-700 p-3 rounded-2xl shadow-inner">
                <img src="shiva.jpg" alt="شیوا فتاحی" class="w-12 h-12 rounded-full object-cover border-2 border-blue-500 bg-slate-700" onerror="this.src='https://ui-avatars.com/api/?name=Shiva+Fattahi&background=3b82f6&color=fff'">
                <div>
                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">توسعه دهنده پلتفرم</div>
                    <div class="text-sm font-black text-white">مهندس شیوا فتاحی</div>
                </div>
            </div>
        </div>
    </aside>

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 hidden md:hidden"></div>

    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full">
        
        <header class="bg-white dark:bg-slate-900 px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center gap-4 sticky top-0 z-20 shadow-sm transition-colors">
            <button onclick="toggleSidebar()" class="md:hidden text-slate-600 dark:text-slate-300 hover:text-blue-600">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <button onclick="renderDashboardHome()" class="flex items-center gap-2 bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 px-4 py-2 rounded-xl font-bold hover:bg-blue-100 dark:hover:bg-blue-800/50 transition-colors">
                <span class="text-xl">🏠</span> داشبورد اصلی
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 pb-32 w-full" id="main-scroll-area">
            
            <!-- داشبورد اصلی (نمودار دایره‌ای) -->
            <div id="dashboard-view" class="max-w-6xl mx-auto block w-full">
                
                <div class="bg-white dark:bg-slate-800 p-6 md:p-8 rounded-[2rem] shadow-sm border border-slate-200 dark:border-slate-700 mb-10 flex flex-col md:flex-row items-center justify-around gap-8 transition-colors">
                    
                    <!-- متن و آمار کلی -->
                    <div class="text-center md:text-right">
                        <h3 class="text-2xl font-black text-slate-800 dark:text-slate-100 mb-2">وضعیت پیشرفت شما</h3>
                        <p class="text-slate-500 dark:text-slate-400 font-medium mb-6">گزارش زنده از تست‌های پاسخ داده شده</p>
                        
                        <div class="flex gap-4 justify-center md:justify-start">
                            <div class="bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-800/50 p-4 rounded-2xl text-center min-w-[100px]">
                                <div class="text-3xl font-black text-emerald-500 mb-1" id="correct-count">0</div>
                                <div class="text-xs font-bold text-emerald-800 dark:text-emerald-400">صحیح 🎯</div>
                            </div>
                            <div class="bg-rose-50 dark:bg-rose-900/20 border border-rose-100 dark:border-rose-800/50 p-4 rounded-2xl text-center min-w-[100px]">
                                <div class="text-3xl font-black text-rose-500 mb-1" id="wrong-count">0</div>
                                <div class="text-xs font-bold text-rose-800 dark:text-rose-400">غلط ❌</div>
                            </div>
                        </div>
                    </div>

                    <!-- نمودار دایره‌ای (Donut) -->
                    <div class="w-48 h-48 relative">
                        <svg viewBox="0 0 36 36" class="circular-chart blue w-full h-full">
                            <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path id="circle-progress" class="circle blue" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <text id="progress-percent" x="18" y="20.35" class="percentage">0%</text>
                        </svg>
                        <div class="text-center text-xs font-bold text-slate-400 mt-2">از کل <span id="total-count">0</span> تست</div>
                    </div>

                </div>

                <h2 class="text-2xl font-black text-slate-800 dark:text-slate-200 mb-6 flex items-center gap-3">
                    📚 سرفصل‌های آموزشی
                </h2>
                <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 w-full"></div>
            </div>

            <!-- محتوای درس و آزمون -->
            <div id="module-view" class="max-w-4xl mx-auto hidden w-full">
                <div id="module-content-area" class="bg-white dark:bg-slate-800 p-6 md:p-10 rounded-[2rem] shadow-sm border border-slate-200 dark:border-slate-700 transition-colors text-content"></div>
                <div id="module-quiz-area" class="mt-10 w-full"></div>
            </div>

        </div>

        <div class="fixed bottom-4 left-4 z-40 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md px-5 py-2 rounded-full shadow-xl border border-slate-200 dark:border-slate-700 font-black flex items-center gap-2 text-sm pointer-events-none transition-colors">
            <span class="text-xl drop-shadow-md">🧬</span> <span class="dark:text-slate-200 text-slate-800">زیست سلولی</span> <span class="text-blue-600 dark:text-blue-400">دکتر مهرعلیخانی</span>
        </div>
    </main>

    <script>
        let totalQuestions = 0;
        let answeredQuestions = 0;
        let correctAnswersCount = 0;
        let wrongAnswersCount = 0;
        const userAnswers = {};

        // بررسی و اعمال تم اولیه
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                localStorage.theme = 'dark';
            } else {
                localStorage.theme = 'light';
            }
        }

        window.onload = () => {
            if (typeof bookData === 'undefined' || bookData.length === 0) {
                document.getElementById('dashboard-view').innerHTML = `
                    <div class="text-center mt-20">
                        <h1 class="text-3xl font-black text-red-500 mb-4">خطا در بارگذاری</h1>
                        <p class="text-slate-600 dark:text-slate-400">فایل bookData.js شناسایی نشد.</p>
                    </div>`;
                return;
            }
            initApp();
        };

        function initApp() {
            bookData.forEach((mod, mIndex) => {
                const qs = mod.quiz || mod.quizzes;
                if (qs) {
                    totalQuestions += qs.length;
                    userAnswers[mIndex] = {};
                }
                
                // جایگزینی کلمه ماژول با بخش در دیتای خام
                if(mod.title) mod.title = mod.title.replace(/ماژول/g, 'بخش');
                if(mod.shortTitle) mod.shortTitle = mod.shortTitle.replace(/ماژول/g, 'بخش');
            });
            document.getElementById('total-count').innerText = totalQuestions;

            buildSidebar();
            renderDashboardHome();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function buildSidebar() {
            const listContainer = document.getElementById('module-list');
            listContainer.innerHTML = ''; 

            bookData.forEach((mod, index) => {
                const btn = document.createElement('button');
                btn.className = 'sidebar-btn w-full text-right p-4 mb-2 rounded-xl transition-all border border-transparent text-slate-400 hover:bg-slate-800 hover:text-white flex items-center justify-between group';
                // حل مشکل نمایش اعداد با استفاده از دایرکشن
                btn.innerHTML = `
                    <div class="text-right w-full flex items-center justify-start gap-2">
                        <span class="font-bold text-lg group-hover:text-blue-400 transition-colors">${index + 1}.</span>
                        <span class="block font-bold group-hover:text-blue-400 transition-colors">${(mod.shortTitle || mod.title).replace(/^[۰-۹0-9\.\s]+/, '')}</span>
                    </div>
                `;
                btn.onclick = () => openModule(index, btn);
                listContainer.appendChild(btn);
            });
        }

        function renderDashboardHome() {
            document.getElementById('dashboard-view').style.display = 'block';
            document.getElementById('module-view').style.display = 'none';
            
            document.querySelectorAll('.sidebar-btn').forEach(b => {
                b.classList.remove('bg-blue-600/20', 'border-blue-500/30', 'text-blue-400');
                b.classList.add('text-slate-400');
            });

            const grid = document.getElementById('dashboard-grid');
            let html = '';
            
            bookData.forEach((mod, index) => {
                const cleanSub = (mod.subtitle || '').replace(/<span class="hidden">\<\/span>/g, '');
                html += `
                <div onclick="openModule(${index})" class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 hover:shadow-xl hover:border-blue-300 dark:hover:border-blue-500 hover:-translate-y-1 transition-all duration-300 cursor-pointer group relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-24 h-24 bg-blue-50 dark:bg-blue-900/20 rounded-br-full -z-10 group-hover:scale-125 transition-transform"></div>
                    <div class="w-12 h-12 bg-gradient-to-tr from-blue-500 to-cyan-400 text-white rounded-xl flex items-center justify-center font-black text-xl mb-4 shadow-md group-hover:rotate-12 transition-transform">${index + 1}</div>
                    <h3 class="text-lg font-black text-slate-800 dark:text-slate-100 mb-2 leading-tight">${mod.title}</h3>
                    <p class="text-sm text-slate-500 dark:text-slate-400 font-medium line-clamp-2">${cleanSub}</p>
                </div>
                `;
            });
            grid.innerHTML = html;
            
            updateProgressUI();
            if(window.innerWidth < 768 && !document.getElementById('sidebar').classList.contains('translate-x-full')) {
                toggleSidebar();
            }
        }

        function openModule(index, btnNode) {
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('module-view').style.display = 'block';
            
            document.querySelectorAll('.sidebar-btn').forEach(b => {
                b.classList.remove('bg-blue-600/20', 'border-blue-500/30', 'text-blue-400');
                b.classList.add('text-slate-400');
            });
            const actualBtn = btnNode || document.getElementById('module-list').children[index];
            if(actualBtn) {
                actualBtn.classList.remove('text-slate-400');
                actualBtn.classList.add('bg-blue-600/20', 'border-blue-500/30', 'text-blue-400');
            }

            const mod = bookData[index];
            let cleanContent = mod.content.replace(/<span class="hidden">.*?<\/span>/g, '');

            let contentHtml = `
                <h1 class="text-3xl md:text-4xl font-black text-slate-900 dark:text-slate-100 mb-3 border-b-4 border-blue-500 pb-4 inline-block">${mod.title}</h1>
                <h3 class="text-lg md:text-xl font-bold text-slate-500 dark:text-slate-400 mb-8">${mod.subtitle || ''}</h3>
                <div class="text-base md:text-lg text-slate-700 dark:text-slate-300 leading-loose">${cleanContent}</div>
            `;
            document.getElementById('module-content-area').innerHTML = contentHtml;

            const qs = mod.quiz || mod.quizzes;
            let quizHtml = '';
            
            if (qs && qs.length > 0) {
                quizHtml += `
                <div class="bg-slate-50 dark:bg-slate-800/50 p-4 md:p-8 rounded-[2rem] border-2 border-dashed border-slate-300 dark:border-slate-700 w-full transition-colors">
                    <h2 class="text-2xl font-black text-blue-600 dark:text-blue-400 mb-8 flex items-center gap-3"><span class="text-3xl">🎯</span> آزمون سنجش مهارت</h2>
                    <div class="space-y-6 w-full">`;
                
                qs.forEach((q, qIndex) => {
                    const alreadyAnswered = userAnswers[index][qIndex] !== undefined;
                    const blockClass = alreadyAnswered ? 'data-answered="true"' : '';
                    
                    quizHtml += `
                    <div class="question-block bg-white dark:bg-slate-800 p-5 md:p-8 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm w-full transition-colors" ${blockClass}>
                        <h4 class="text-lg md:text-xl font-black text-slate-800 dark:text-slate-100 mb-6 leading-relaxed text-right"><span class="text-blue-500 ml-1">${qIndex + 1}-</span> ${q.question}</h4>
                        <div class="space-y-3 w-full">`;
                    
                    q.options.forEach((opt, oIndex) => {
                        const isCorrect = (oIndex === q.answer);
                        let btnClass = "quiz-option w-full text-right p-4 rounded-2xl border-2 border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 font-bold text-slate-700 dark:text-slate-300 transition-all flex items-center gap-3";
                        let disabledState = "";
                        
                        if (alreadyAnswered) {
                            disabledState = "disabled";
                            if (isCorrect) {
                                btnClass += " !bg-emerald-100 dark:!bg-emerald-900/30 !border-emerald-500 !text-emerald-800 dark:!text-emerald-400 opacity-100";
                            } else if (userAnswers[index][qIndex] === oIndex) {
                                btnClass += " !bg-rose-100 dark:!bg-rose-900/30 !border-rose-500 !text-rose-800 dark:!text-rose-400 opacity-100";
                            } else {
                                btnClass += " opacity-40 cursor-not-allowed";
                            }
                        } else {
                            btnClass += " hover:bg-blue-50 dark:hover:bg-blue-900/20 hover:border-blue-300 dark:hover:border-blue-700 cursor-pointer";
                        }

                        quizHtml += `
                            <button ${disabledState} data-opt-index="${oIndex}" onclick="checkAnswer(${index}, ${qIndex}, ${oIndex}, ${q.answer}, this)" class="${btnClass}">
                                <span class="inline-flex shrink-0 w-8 h-8 items-center justify-center bg-white dark:bg-slate-800 shadow-sm rounded-full text-slate-400 dark:text-slate-500 font-black">${oIndex + 1}</span> 
                                <span class="text-right flex-1">${opt}</span>
                            </button>`;
                    });

                    const cleanExp = q.explanation.replace(/<span class="hidden">.*?<\/span>/g, '');
                    const expDisplay = alreadyAnswered ? 'block' : 'none';

                    quizHtml += `
                        </div>
                        <div id="exp_${index}_${qIndex}" style="display: ${expDisplay};" class="mt-6 p-5 md:p-6 bg-blue-50 dark:bg-blue-900/20 border-r-4 border-blue-500 rounded-l-2xl text-blue-900 dark:text-blue-100 text-base leading-loose text-justify transition-colors">
                            <strong class="text-blue-700 dark:text-blue-400 text-lg flex items-center gap-2 mb-2"><span>💡</span> تحلیل استاد:</strong>
                            ${cleanExp}
                        </div>
                    </div>`;
                });
                
                // دکمه دانلود کارنامه
                quizHtml += `
                    <div class="mt-8 text-center">
                        <button onclick="downloadReport(${index})" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2 mx-auto">
                            <span>📥</span> دانلود کارنامه این بخش
                        </button>
                    </div>
                </div></div>`;
            }
            document.getElementById('module-quiz-area').innerHTML = quizHtml;
            document.getElementById('main-scroll-area').scrollTo({ top: 0, behavior: 'smooth' });
            
            if(window.innerWidth < 768 && !document.getElementById('sidebar').classList.contains('translate-x-full')) {
                toggleSidebar();
            }
        }

        function checkAnswer(mIndex, qIndex, selectedOptIndex, correctOptIndex, btnEl) {
            const parent = btnEl.closest('.question-block');
            if(parent.getAttribute('data-answered') === 'true') return;
            parent.setAttribute('data-answered', 'true');
            userAnswers[mIndex][qIndex] = selectedOptIndex;

            const btns = parent.querySelectorAll('.quiz-option');
            btns.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:bg-blue-50', 'hover:border-blue-300', 'dark:hover:bg-blue-900/20', 'dark:hover:border-blue-700', 'cursor-pointer');
                b.classList.add('opacity-40', 'cursor-not-allowed');
            });

            btnEl.classList.remove('opacity-40');
            
            if (selectedOptIndex === correctOptIndex) {
                btnEl.classList.add('!bg-emerald-100', 'dark:!bg-emerald-900/30', '!border-emerald-500', '!text-emerald-800', 'dark:!text-emerald-400', 'opacity-100');
                correctAnswersCount++;
            } else {
                btnEl.classList.add('!bg-rose-100', 'dark:!bg-rose-900/30', '!border-rose-500', '!text-rose-800', 'dark:!text-rose-400', 'opacity-100');
                wrongAnswersCount++;
                const correctBtn = parent.querySelector(`[data-opt-index="${correctOptIndex}"]`);
                if (correctBtn) {
                    correctBtn.classList.remove('opacity-40');
                    correctBtn.classList.add('!bg-emerald-100', 'dark:!bg-emerald-900/30', '!border-emerald-500', '!text-emerald-800', 'dark:!text-emerald-400', 'opacity-100');
                }
            }
            
            answeredQuestions++;
            updateProgressUI();
            document.getElementById(`exp_${mIndex}_${qIndex}`).style.display = 'block';
        }

        function updateProgressUI() {
            document.getElementById('correct-count').innerText = correctAnswersCount;
            document.getElementById('wrong-count').innerText = wrongAnswersCount;
            
            let percent = 0;
            if (totalQuestions > 0) {
                percent = Math.round((answeredQuestions / totalQuestions) * 100);
            }
            
            document.getElementById('progress-percent').innerText = percent + '%';
            // فرمول محاسبه دور دایره: 100 * percent / 100
            document.getElementById('circle-progress').setAttribute('stroke-dasharray', `${percent}, 100`);
        }

        // تابع تولید و دانلود کارنامه (TXT)
        function downloadReport(moduleIndex) {
            const mod = bookData[moduleIndex];
            const qs = mod.quiz || mod.quizzes;
            if(!qs) return;

            let correctInModule = 0;
            let wrongInModule = 0;
            let unansweredInModule = 0;
            
            let reportText = `کارنامه آزمون: ${mod.title.replace(/ماژول/g, 'بخش')}\n`;
            reportText += `استاد: دکتر علیرضا مهرعلیخانی\n`;
            reportText += `--------------------------------------------------\n\n`;

            qs.forEach((q, qIndex) => {
                const userAns = userAnswers[moduleIndex][qIndex];
                reportText += `سوال ${qIndex + 1}: ${q.question}\n`;
                
                if (userAns === undefined) {
                    reportText += `وضعیت: ⚪ بدون پاسخ\n\n`;
                    unansweredInModule++;
                } else {
                    const isCorrect = (userAns === q.answer);
                    if (isCorrect) {
                        reportText += `پاسخ شما: ${q.options[userAns]} (صحیح ✅)\n\n`;
                        correctInModule++;
                    } else {
                        reportText += `پاسخ شما: ${q.options[userAns]} (غلط ❌)\n`;
                        reportText += `پاسخ صحیح: ${q.options[q.answer]}\n\n`;
                        wrongInModule++;
                    }
                }
            });

            reportText += `--------------------------------------------------\n`;
            reportText += `تعداد پاسخ صحیح: ${correctInModule}\n`;
            reportText += `تعداد پاسخ غلط: ${wrongInModule}\n`;
            reportText += `تعداد بی پاسخ: ${unansweredInModule}\n`;
            reportText += `درصد موفقیت در این بخش: ${Math.round((correctInModule / qs.length) * 100)}%\n`;

            const blob = new Blob([reportText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Report_Section_${moduleIndex + 1}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
